name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f "AssetScannerApp.zip" ]; then
            unzip -o AssetScannerApp.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore

      - name: Verify keystore
        run: |
          ls -l "$GITHUB_WORKSPACE/release.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$KEYSTORE_PASSWORD"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build Release APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          cd "$PROJECT_DIR"
          gradle assembleRelease

      - name: Sign APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          APKSIGNER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk -maxdepth 4 -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/release.keystore" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias nova --key-pass env:KEYSTORE_PASSWORD --out "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetScanner-APK
          path: "**/app/build/outputs/apk/release/app-release.apk"
